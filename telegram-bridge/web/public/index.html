<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Lagrange · consola</title>
  <link rel="stylesheet" href="/app.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <div id="app" class="app">
    <header class="barra" id="barra">
      <button type="button" class="boton-icono boton-lateral" id="abrir-lateral" aria-label="Abrir almas, agentes y vistas" aria-controls="lateral" aria-expanded="false"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12"></path></svg></button>
      <div class="marca">
        <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><circle cx="10" cy="10" r="3"></circle><circle cx="10" cy="10" r="8"></circle><circle cx="18" cy="10" r="1.2" fill="currentColor"></circle></svg>
        <span class="marca-nombre">Lagrange</span>
        <span class="tenue">consola local</span>
      </div>
      <nav class="segmentos" aria-label="Vista" id="segmentos">
        <a class="segmento" href="/" data-ruta data-vista="charlas">Charlas</a>
        <a class="segmento" href="/tablero" data-ruta data-vista="tablero">Tablero</a>
        <a class="segmento" href="/programado" data-ruta data-vista="programado">Programado</a>
        <a class="segmento" href="/proveedores" data-ruta data-vista="proveedores">Proveedores<span class="punto-aviso" id="aviso-proveedores" aria-hidden="true" hidden></span></a>
      </nav>
      <button type="button" class="boton-paleta" id="abrir-paleta" aria-haspopup="dialog" aria-label="Buscar o ir a… (Ctrl K)"><svg class="lupa-paleta" width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="7" cy="7" r="4.5"></circle><path d="M10.5 10.5l4 4"></path></svg><span class="texto-paleta">Buscar o ir a…</span> <span class="tecla">Ctrl K</span></button>
      <div class="estado-daemon mono" id="estado-daemon" aria-live="polite">conectando…</div>
      <div class="barra-derecha">
        <div class="carriles" id="carriles"></div>
        <button type="button" class="boton-icono" id="tema" title="Tema"></button>
        <div class="menu-cancelar">
          <button type="button" class="boton peligro" id="cancelar" aria-haspopup="true" aria-expanded="false">Cancelar…</button>
          <div class="menu" id="menu-cancelar" hidden>
            <button type="button" data-carril="alma">Cancelar charla</button>
            <button type="button" data-carril="cast">Cancelar cast</button>
            <button type="button" data-carril="">Cancelar ambos</button>
            <p class="menu-nota">El carril principal (/run y /plan de Telegram) no se corta desde acá.</p>
          </div>
        </div>
      </div>
    </header>

    <aside class="lateral" id="lateral" aria-label="Almas y agentes"></aside>
    <main class="centro" id="centro"></main>
    <aside class="panel" id="panel" aria-label="Contexto"></aside>
    <nav class="tira" id="tira" aria-label="Secciones del panel"></nav>
  </div>
  <div class="velo-cajon" id="velo-cajon" hidden></div>
  <div class="aviso-flotante" id="aviso" role="status" hidden></div>
  <div class="paleta-fondo" id="paleta" hidden>
    <div class="paleta" role="dialog" aria-modal="true" aria-label="Paleta de comandos">
      <input type="text" id="paleta-entrada" placeholder="Hablar con…, castear…, ir a…" autocomplete="off" spellcheck="false" role="combobox" aria-expanded="true" aria-controls="paleta-lista" aria-autocomplete="list">
      <ul id="paleta-lista" role="listbox"></ul>
      <div class="paleta-pie tenue">↑↓ para moverse · Enter para elegir · Esc para cerrar</div>
    </div>
  </div>
</body>
</html>
