# Config del proxy de egress de los lotes (FEAT-061 fase 2).
#
# `FilterDefaultDeny Yes` es lo que hace que la lista signifique algo: sin eso,
# el filtro seria una lista de bloqueo y todo lo demas pasaria.
#
# `ConnectPort 443` y nada mas: un CONNECT a otro puerto (por ejemplo, un
# tunel SSH a 22) se rechaza. El proxy no ve las rutas de una conexion TLS
# (C7 del diseno, aceptado en la fase 2; la terminacion TLS es requisito de la
# fase 4).
# Sin `User`/`Group`: el contenedor ya corre como nobody (--user 65534:65534).
# Con `--cap-drop=ALL`, tinyproxy arrancado como root no puede hacer setgid y
# sale con codigo 77 ("Unable to change to group"). Medido en la primera
# corrida real del lote.
Port 8888
Listen 0.0.0.0
Timeout 600
LogFile "/tmp/tinyproxy.log"
LogLevel Connect
MaxClients 50
ConnectPort 443
Filter "/etc/tinyproxy/permitidos"
FilterExtended Yes
FilterURLs No
FilterDefaultDeny Yes
